[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagebloom"
version = "0.2.1"
description = "Explainable, local-first SOC triage with Microsoft security context and incident correlation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Blessing Ezeobioha" }
]
keywords = ["cybersecurity", "soc", "log-analysis", "incident-response", "mitre-attack"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7.6"]
ui = ["streamlit==1.63.0"]

[project.scripts]
triagebloom = "triagebloom.cli:main"

[project.urls]
Homepage = "https://github.com/Briella009/triagebloom"
Issues = "https://github.com/Briella009/triagebloom/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
