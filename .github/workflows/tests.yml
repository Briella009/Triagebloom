name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tooling
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          coverage run --source=src/triagebloom -m unittest discover -s tests -v
          coverage report --fail-under=80

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install web interface
        run: python -m pip install -r requirements.txt
      - name: Start Streamlit and check health
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > /tmp/triagebloom-streamlit.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/triagebloom-streamlit.log
          exit 1
